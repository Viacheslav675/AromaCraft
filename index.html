<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AromaCraft Coffee — кавовий магазин</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header__logo">☕ AromaCraft</div>

    <nav class="header__nav">
      <a href="#">Головна сторінка</a>
      <a href="#">Кава</a>
      <a href="#">Про нас</a>
      <a href="#">Оплата і доставка</a>
      <a href="#">Профіль</a>
    </nav>

    <button class="header__cart-btn">🛒 Кошик</button>
  </header>

  <section class="hero">
    <div class="hero__text">
      <h1 class="hero__title">Найкраща кава<br>для ваших ранків</h1>
      <button class="hero__btn">Купити зараз</button>
    </div>
  </section>

  <section class="categories">
    <h2 class="category_title">Категорії товарів</h2>

    <div class="category-conteiner">

      <div class="category-card">
        <h3>Мелена кава</h3>
        <img src="" alt="Мелена кава">
        <p>Помел для джезви, еспресо, френч-прес</p>
        <button type="button" class="category_btn">Детальніше</button>
      </div>

      <div class="category-card">
        <h3>Кава в зернах</h3>
        <img src="" alt="Кава в зернах">
        <p>Відібрані сорти зі всього світу</p>
        <button type="button" class="category_btn">Детальніше</button>
      </div>

      <div class="category-card">
        <h3>Дріп-пакети</h3>
        <img src="" alt="Дріп-пакети">
        <p>Дріп-пакети, еспресо, френч-прес</p>
        <button type="button" class="category_btn">Детальніше</button>
      </div>

    </div>
  </section>

</body>
</html>
